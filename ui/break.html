<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0E">
<title>Break · SlabCoach</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="/icone.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 27 oct 2026 - les memes polices que l'app, servies par SlabCoach */
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:500;font-display:swap;src:url(/barlow-500.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(/barlow-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:500;font-display:swap;src:url(/barlow-cond-500.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(/barlow-cond-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(/barlow-cond-700.woff2) format('woff2')}

:root{--fond:#0B0B0E; --carte:#151519; --carte2:#1D1D23; --ligne:#2B2A32; --sep:#1B1B21; --texte:#F4F2EE; --doux:#A9A6B1; --pale:#8C8996;
  --acc:#B9BEFF; --acc-fonce:#1E2038; --or:#E9CF8E; --or-fonce:#2A2416; --vert:#8FD4A4; --vert-fond:#13261B; --rouge:#FFB3B3; --rouge-fond:#2A1114}
*{box-sizing:border-box}
html,body{margin:0; background:var(--fond); color:var(--texte); font-family:'Barlow',system-ui,sans-serif}
.ecran{max-width:760px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) 16px 40px; display:flex; flex-direction:column; gap:14px}
.marque{display:flex; align-items:center; gap:8px; color:var(--doux); font-size:13px}
.marque img{width:24px; height:24px; border-radius:6px}
h1{margin:0; font-family:'Barlow Condensed',sans-serif; font-size:32px; line-height:1.05}
.pastilles{display:flex; flex-wrap:wrap; gap:6px}
.tag{display:inline-flex; align-items:center; font-size:12.5px; padding:4px 9px; border-radius:9px; background:var(--carte2); color:#DCD9E2; white-space:nowrap}
.tag.acc{background:var(--acc-fonce); color:var(--acc)} .tag.or{background:var(--or-fonce); color:var(--or)} .tag.vert{background:var(--vert-fond); color:var(--vert)}
.bloc{background:var(--carte); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px}
.section{font-size:12px; font-weight:600; color:var(--pale); text-transform:uppercase; letter-spacing:1px}
.rangee{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--sep)}
.rangee:last-child{border-bottom:none}
.ecusson{width:40px; height:40px; border-radius:10px; background:var(--carte2); color:var(--acc); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:700; flex-shrink:0}
.milieu{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.nom{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.prix{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px}
.code{font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--doux); word-break:break-all}
.vide{color:var(--doux); text-align:center; padding:40px}
details summary{cursor:pointer; color:var(--acc); font-weight:600}
</style>
</head>
<body>
<main class="ecran" id="vue"><div class="vide">…</div></main>
<script>
'use strict';
// 27 oct 2026 (revue) : page publique en francais OU en anglais (langue du navigateur, ?lang=, ou le choix fait dans l'app),
// une place sans prix affiche « — » (pas « 0 $ »), et les sections ouvertes le restent quand la page se met a jour.
const EN = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'fr') return q === 'en';
  const c = (document.cookie.match(/(?:^|; )lr_langue=(fr|en)/) || [])[1];
  if (c) return c === 'en';
  return (navigator.language || '').toLowerCase().startsWith('en');
})();
document.documentElement.lang = EN ? 'en' : 'fr';
const T = (fr, en) => EN ? en : fr;
const LOC = EN ? 'en-CA' : 'fr-CA';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag = (t, c='') => `<span class="tag ${c}">${esc(t)}</span>`;
const argent = (v) => { const n = Number(v); if (!(n > 0)) return '—'; const x = n.toLocaleString(LOC, {maximumFractionDigits:0}); return EN ? '$' + x : x + ' $'; };
const heure = (d) => { const t = Date.parse(d || ''); return isFinite(t) ? new Date(t).toLocaleString(LOC, {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : ''; };
const jeton = location.pathname.split('/').filter(Boolean).pop();
async function charger(){
  let d;
  try { const r = await fetch('/api/b/' + encodeURIComponent(jeton)); d = await r.json(); if (!r.ok) throw new Error(d.erreur || T('Introuvable', 'Not found')); }
  catch (e) { document.getElementById('vue').innerHTML = `<div class="vide">${esc(T(e.message, e.message === 'Break introuvable' ? 'Break not found' : e.message))}</div>`; return; }
  const ouverts = [...document.querySelectorAll('#vue details')].map(x => x.open);
  const t = d.tirage || {}, vendues = d.places.filter(p => p.acheteur).length;
  const parPlace = Object.fromEntries(d.places.map(p => [p.id, p]));
  const modes = {equipes:T('Équipes', 'Teams'), divisions:'Divisions', joueurs:T('Joueurs', 'Players'), aleatoire:T('Équipes aléatoires', 'Random teams')};
  document.getElementById('vue').innerHTML = `
    <div class="marque"><img src="/logo_sc_prizm.svg" alt="">SlabCoach · ${T('page publique du break', 'public break page')}</div>
    <h1>${esc(d.nom)}</h1>
    <div class="pastilles">${d.produit ? tag(d.produit.nom, 'acc') + tag(d.boites + ' × ' + d.produit.format) : ''}${tag(modes[d.mode] || d.mode)}${tag(vendues + '/' + d.places.length + ' ' + T('places vendues', 'spots sold'))}
      ${t.resultat ? tag(T('Tirage fait ', 'Draw done ') + heure(t.le), 'vert') : t.engage ? tag(T('Tirage engagé', 'Draw committed'), 'or') : ''}</div>
    ${d.empreinte ? `<div class="bloc"><div class="section">${T('Tirage vérifiable', 'Verifiable draw')}</div>
      <div class="pastilles">${tag(T('Empreinte publiée avant le tirage', 'Fingerprint published before the draw'), 'acc')}${t.graine ? tag(T('Graine révélée', 'Seed revealed'), 'vert') : tag(T('Graine révélée après le tirage', 'Seed revealed after the draw'))}</div>
      <div class="code">SHA-256 : ${esc(d.empreinte)}</div>
      ${t.graine ? `<details><summary>${T('Vérifier', 'Verify')}</summary><div class="code" style="margin-top:8px">${T('graine', 'seed')} : ${esc(t.graine)}<br>sha256(${T('graine', 'seed')}) = ${T('empreinte ci-dessus', 'fingerprint above')}<br>${T('méthode', 'method')} : ${esc(t.methode || '')}<br>${T('lots', 'lots')} : ${esc((t.lots || []).join(', '))}<br>${T('places (ordre)', 'spots (order)')} : ${esc((t.participants || []).map(id => (parPlace[id] || {}).libelle || id).join(', '))}</div></details>` : ''}</div>` : ''}
    <div class="bloc"><div class="section">${T('Places', 'Spots')}</div>${d.places.map(p => `<div class="rangee"><span class="ecusson">${esc(String(p.cle || '').length <= 4 && p.cle ? p.cle : String(p.libelle).slice(0, 3).toUpperCase())}</span>
      <span class="milieu"><span class="nom">${esc(p.libelle)}</span><span class="pastilles">${p.acheteur ? tag(p.acheteur, 'acc') : tag(T('Disponible', 'Available'), 'vert')}${p.lot ? p.lot.split(',').map(e => tag(e, 'or')).join('') : ''}</span></span>
      <span class="prix">${argent(p.prix)}</span></div>`).join('')}</div>
    ${d.frappes.length ? `<div class="bloc"><div class="section">${T('Cartes sorties', 'Cards pulled')}</div>${d.frappes.map(f => { const p = parPlace[f.place_id]; return `<div class="rangee"><span class="ecusson">${esc(f.equipe || '?')}</span>
      <span class="milieu"><span class="nom">${esc(f.joueur || f.carte)}</span><span class="pastilles">${f.carte && f.joueur ? tag(f.carte) : ''}${p ? tag('→ ' + (p.acheteur || p.libelle), 'acc') : ''}${f.pile_ou_face ? tag(T('Pile ou face ', 'Coin flip ') + f.pile_ou_face.options.join('/') + ' → ' + f.pile_ou_face.gagnant, 'or') : ''}${tag(heure(f.le))}</span></span></div>`; }).join('')}</div>` : ''}
    ${Object.keys(d.resume_equipes || {}).length && d.mode !== 'joueurs' ? `<details class="bloc"><summary>${T('Checklist par équipe', 'Checklist by team')}</summary>${Object.entries(d.resume_equipes).sort((a, b) => b[1].recrues - a[1].recrues || b[1].nb - a[1].nb).map(([k, r]) => `<div class="rangee"><span class="ecusson">${esc(k)}</span>
      <span class="milieu"><span class="pastilles">${tag(r.nb + ' ' + T('cartes', 'cards'))}${r.recrues ? tag(r.recrues + ' RC', 'acc') : ''}${r.autos ? tag(r.autos + ' auto', 'or') : ''}${r.numerotees ? tag(r.numerotees + ' /#') : ''}</span></span></div>`).join('')}</details>` : ''}`;
  document.querySelectorAll('#vue details').forEach((x, i) => { if (ouverts[i]) x.open = true; });
}
charger(); setInterval(() => { if (document.visibilityState === 'visible') charger(); }, 20000);
</script>
</body>
</html>
