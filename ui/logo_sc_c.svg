<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- 30 oct 2026 (Mathieu : « animer le nouveau style de prism comme un liquide dans le C ») : le C est un film prism
     ou les couleurs coulent comme un liquide (des gouttes floues qui se melangent), le S reste net. Anime dans le
     fichier lui-meme : marche dans une balise img, sur le site, dans l'app et dans les courriels qui affichent le SVG. -->
<defs>
  <mask id="c" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
    <path d="M160.94 154.87 A82 82 0 1 1 160.94 45.13" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="butt"/>
  </mask>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E86BD0"/><stop offset=".33" stop-color="#7F8CFF"/><stop offset=".66" stop-color="#3FD0E6"/><stop offset="1" stop-color="#F6C85A"/>
  </linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#FF4FCF"/><stop offset=".6" stop-color="#FF4FCF" stop-opacity=".55"/><stop offset="1" stop-color="#FF4FCF" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#55C8FF"/><stop offset=".6" stop-color="#55C8FF" stop-opacity=".55"/><stop offset="1" stop-color="#55C8FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#FFD66B"/><stop offset=".6" stop-color="#FFD66B" stop-opacity=".55"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
  <radialGradient id="g4"><stop offset="0" stop-color="#8E7BFF"/><stop offset=".6" stop-color="#8E7BFF" stop-opacity=".55"/><stop offset="1" stop-color="#8E7BFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="g5"><stop offset="0" stop-color="#7DF2C8"/><stop offset=".6" stop-color="#7DF2C8" stop-opacity=".5"/><stop offset="1" stop-color="#7DF2C8" stop-opacity="0"/></radialGradient>
  <radialGradient id="reflet" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></radialGradient>
  <filter id="fondu" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<g mask="url(#c)">
  <rect width="200" height="200" fill="url(#base)">
    <animate attributeName="opacity" values="1;.85;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g filter="url(#fondu)">
    <circle r="62" fill="url(#g1)"><animateMotion dur="7.5s" repeatCount="indefinite" path="M40 60 C 120 0, 200 80, 150 150 S 20 190, 40 60 Z"/></circle>
    <circle r="58" fill="url(#g2)"><animateMotion dur="9.5s" repeatCount="indefinite" path="M170 50 C 90 20, 10 110, 60 170 S 200 150, 170 50 Z"/></circle>
    <circle r="54" fill="url(#g3)"><animateMotion dur="11s" repeatCount="indefinite" path="M100 190 C 0 150, 30 20, 110 30 S 220 140, 100 190 Z"/></circle>
    <circle r="56" fill="url(#g4)"><animateMotion dur="8.5s" repeatCount="indefinite" path="M20 120 C 60 200, 190 190, 180 100 S 60 0, 20 120 Z"/></circle>
    <circle r="46" fill="url(#g5)"><animateMotion dur="13s" repeatCount="indefinite" path="M100 10 C 200 30, 190 170, 100 190 S 0 60, 100 10 Z"/></circle>
  </g>
  <rect width="200" height="200" fill="url(#reflet)"/>
</g>

</svg>
