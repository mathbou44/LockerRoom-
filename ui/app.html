<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LockerRoom">
<meta name="theme-color" content="#0A0D10">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icone.png">
<title>LockerRoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* LockerRoom - outils pour breakers et boutiques de cartes. Sombre, glace. */
:root{
  --fond:#0A0D10; --carte:#14181D; --carte2:#1C2228; --ligne:#29313A; --sep:#1A1F25;
  --texte:#F2F5F7; --doux:#A3ACB5; --pale:#87909A;
  --acc:#7FD0FF; --acc-fonce:#0F2533; --acc-texte:#03131E;
  --or:#E8C46A; --or-fonce:#2B2414;
  --vert:#8FD4A4; --vert-fond:#13261B; --rouge:#FFB3B3; --rouge-fond:#2A1114;
  --haut:max(14px, env(safe-area-inset-top)); --bas:env(safe-area-inset-bottom);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0; background:var(--fond); color:var(--texte); font-family:'Barlow',system-ui,sans-serif; font-size:16px}
body{min-height:100vh; padding-bottom:calc(76px + var(--bas))}
body.sandbox::before{content:'SANDBOX eBay · données de test'; position:sticky; top:0; z-index:60; display:block; text-align:center; padding:6px 10px; font:700 12px/1.2 'Barlow Condensed',sans-serif; letter-spacing:.12em; background:#F2B84B; color:#1A1205}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit}
button{cursor:pointer}
a{color:var(--acc); text-decoration:none}
h1,h2,h3{margin:0}
.ecran{padding:calc(var(--haut) + 18px) 18px 24px; display:flex; flex-direction:column; gap:16px; max-width:640px; margin:0 auto}
.entete{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px}
.entete > div{min-width:0}
.titre{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:32px; letter-spacing:.2px; line-height:1}
.sous{font-size:13px; color:var(--doux)}
.titre.moyen{font-size:25px; line-height:1.1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.rond{width:44px; height:44px; border-radius:22px; border:none; background:var(--carte); color:var(--texte); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.rond.acc{background:var(--acc); color:var(--acc-texte)}
.btn{height:52px; border-radius:14px; border:none; background:var(--acc); color:var(--acc-texte); font-weight:700; font-size:17px; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:0 14px}
.btn.ghost{background:transparent; border:1px solid var(--ligne); color:var(--texte); font-weight:600}
.btn.petit{height:42px; font-size:15px; border-radius:12px}
.btn.danger{background:#C8102E; color:#fff}
.btn:disabled{opacity:.5}
.pilule{height:36px; padding:0 13px; border-radius:18px; border:1px solid var(--acc); background:transparent; color:var(--acc); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex-shrink:0}
.pilule.plein{background:var(--acc-fonce)}
.chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px; padding:0 14px; border-radius:17px; border:1px solid var(--ligne); background:transparent; color:#D6DBE0; font-size:14px; white-space:nowrap; flex-shrink:0}
.chip.on{background:var(--texte); color:var(--fond); border-color:var(--texte); font-weight:600}
.seg{display:flex; background:var(--carte); border-radius:12px; padding:4px}
.seg button{flex:1; height:40px; border-radius:9px; border:none; background:transparent; color:#D6DBE0; font-size:14px; font-weight:600; padding:0 2px; white-space:nowrap}
.seg button.on{background:var(--texte); color:var(--fond)}
.seg.petit button{height:34px; font-size:13px}
.pastilles{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
@media (max-width:899px){ .pastilles.defile{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-mask-image:linear-gradient(to right,#000 88%,transparent); mask-image:linear-gradient(to right,#000 88%,transparent); padding-right:18px} .pastilles.defile::-webkit-scrollbar{display:none} .pastilles.defile > *{flex-shrink:0} }
button.tag{border:none; cursor:pointer; font:inherit; font-size:12px}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:2px 8px; border-radius:8px; background:var(--carte2); color:#D6DBE0; white-space:nowrap}
.tag.acc{background:var(--acc-fonce); color:var(--acc)} .tag.or{background:var(--or-fonce); color:var(--or)}
.tag.vert{background:var(--vert-fond); color:var(--vert)} .tag.rouge{background:var(--rouge-fond); color:var(--rouge)}
.tag.grand{font-size:13px; padding:5px 10px; border-radius:10px}
.bloc{background:var(--carte); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px}
.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.kpi{background:var(--carte); border-radius:16px; padding:14px 12px; display:flex; flex-direction:column; gap:4px; min-width:0}
.kpi b{font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kpi b.vert{color:var(--vert)} .kpi b.rouge{color:var(--rouge)}
.kpi span{font-size:12px; color:var(--doux)}
.section{font-size:13px; font-weight:600; color:var(--pale); text-transform:uppercase; letter-spacing:1px; display:flex; justify-content:space-between; align-items:center; gap:8px}
.action{display:flex; align-items:center; gap:12px; background:var(--carte); border-radius:14px; padding:14px; color:var(--texte); border:none; width:100%; text-align:left}
.action .ico{width:38px; height:38px; border-radius:11px; background:var(--acc-fonce); color:var(--acc); display:flex; align-items:center; justify-content:center; flex-shrink:0}
.action .txt{flex:1; display:flex; flex-direction:column; gap:3px; min-width:0}
.action .txt b{font-weight:600}
.tuiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.tuile-n{background:var(--carte); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:2px; color:var(--texte); border:1px solid var(--ligne)}
.tuile-n b{font-family:'Barlow Condensed',sans-serif; font-size:44px; line-height:1}
.tuile-n span{font-size:14px; color:var(--doux); font-weight:600}
.tuile-n.rouge b{color:var(--rouge)} .tuile-n.vert b{color:var(--vert)} .tuile-n.or b{color:var(--or)} .tuile-n.acc b{color:var(--acc)}
.tuile-ebay{background:var(--acc-fonce); border-color:var(--acc)}
.fiches-s{display:flex; flex-direction:column; gap:10px}
.fiche-s{background:var(--carte); border:1px solid var(--ligne); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px}
.fiche-s .haut{display:flex; gap:12px; align-items:center; min-width:0}
.fiche-s .nom{font-weight:600; font-size:15px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-width:0}
.fiche-s .bas{display:flex; align-items:center; justify-content:space-between; gap:10px}
.fiche-s .prix{font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:700}
.fiche-s .prix s{color:var(--doux); font-size:17px; font-weight:500; margin-right:4px}
.fiche-s .boutons{display:flex; gap:8px}
.vig{width:46px; height:46px; border-radius:10px; object-fit:cover; background:var(--carte2); flex-shrink:0}
.ix.ok{color:var(--vert)}
@media (min-width:900px){ .tuiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.grille-tuiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
.tuile{display:flex; flex-direction:column; gap:8px; align-items:flex-start; text-align:left; background:var(--carte); border:1px solid var(--ligne); border-radius:14px; padding:14px; color:var(--texte); width:100%}
.tuile b{font-size:16px; font-weight:600}
.tuile:active{border-color:var(--acc)}
details.reglage summary{list-style:none; cursor:pointer; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--doux)}
details.reglage summary::-webkit-details-marker{display:none}
.grille-actions{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.grille-actions .action{flex-direction:column; align-items:flex-start; gap:10px; padding:14px 12px}
.recherche{display:flex; align-items:center; gap:10px; height:44px; padding:0 14px; border-radius:12px; background:var(--carte); color:var(--doux)}
.recherche input{flex:1; background:transparent; border:none; outline:none; color:var(--texte); min-width:0}
.liste{display:flex; flex-direction:column}
.rangee{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--sep); color:var(--texte); background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left}
.rangee:last-child{border-bottom:none}
.bloc .liste .rangee{padding:10px 0}
.rangee .milieu{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px}
.rangee .nom{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rangee .det{font-size:13px; color:var(--doux); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rangee .droite{display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0}
.ecusson{width:42px; height:42px; border-radius:11px; background:var(--carte2); border:1px solid var(--ligne); color:var(--acc); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; letter-spacing:.5px; flex-shrink:0}
.rang{width:22px; text-align:right; font-family:'Barlow Condensed',sans-serif; font-weight:700; color:var(--pale); flex-shrink:0}
.prix{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; white-space:nowrap}
.prix.vert{color:var(--vert)} .prix.rouge{color:var(--rouge)}
.barre{height:6px; border-radius:3px; background:var(--carte2); overflow:hidden}
.barre i{display:block; height:100%; border-radius:3px; background:var(--acc)}
.barre i.vert{background:var(--vert)}
.vide{text-align:center; color:var(--doux); padding:34px 10px; font-size:15px; line-height:1.5; display:flex; flex-direction:column; align-items:center; gap:12px}
.charge{display:flex; justify-content:center; padding:40px}
.roue{width:26px; height:26px; border-radius:13px; border:3px solid var(--carte2); border-top-color:var(--acc); animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.prog{position:relative; width:26px; height:26px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center}
.prog svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.prog circle{fill:none; stroke-width:3.4}
.prog .fond{stroke:rgba(127,208,255,.2)}
.prog .arc{stroke:var(--acc); stroke-linecap:round; stroke-dasharray:97.39; stroke-dashoffset:97.39; transition:stroke-dashoffset .6s ease}
.prog.vert .arc{stroke:var(--vert)} .prog.vert .fond{stroke:rgba(143,212,164,.2)} .prog.vert b{color:var(--vert)}
.prog b{position:relative; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px; line-height:1; color:var(--acc)}
.prog b small{font-size:7px; margin-left:.5px}
.boutons{display:flex; gap:8px}
.retour{display:inline-flex; align-items:center; gap:4px; height:36px; font-size:16px; color:var(--acc); background:none; border:none; padding:0; align-self:flex-start}
.plus{border:none; background:none; color:var(--acc); font-weight:600; padding:12px; width:100%}
.ix{width:30px; height:30px; border-radius:15px; border:none; background:var(--carte2); color:var(--doux); display:flex; align-items:center; justify-content:center; flex-shrink:0}
/* formulaires */
.champ{height:46px; border-radius:12px; border:1px solid var(--ligne); background:var(--carte2); padding:0 12px; width:100%; outline:none; min-width:0}
textarea.champ{height:120px; padding:10px 12px; resize:vertical; font-size:14px; line-height:1.4}
select.champ{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--doux) 50%),linear-gradient(135deg,var(--doux) 50%,transparent 50%); background-position:calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px}
.champ:focus{border-color:var(--acc)}
/* 23 oct 2026 - une photo, un bouton */
.photo-grand{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:170px; border-radius:18px;
  border:1.5px dashed var(--acc); background:var(--acc-fonce); color:var(--acc); cursor:pointer; text-align:center; padding:16px}
.photo-grand b{font-size:18px} .photo-grand span{font-size:13px; opacity:.8}
.photos-prises{display:flex; gap:10px; justify-content:center} .photos-prises img{width:96px; height:134px; object-fit:cover; border-radius:10px; border:1px solid var(--ligne)}
.bandeau{border-radius:12px; padding:12px; font-size:14px; line-height:1.45; background:var(--rouge-fond, #2A1114); color:var(--rouge, #FFB3B3)}
.bandeau.info{background:var(--or-fonce); color:var(--or)}
.champ.douteux{border-color:var(--or); box-shadow:0 0 0 1px var(--or) inset}
.lecture{display:flex; flex-direction:column; align-items:center; gap:12px; padding:28px 0; color:var(--doux)}
.grille-champs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.grille-champs.trois{grid-template-columns:repeat(3,minmax(0,1fr))}
.grille-champs label, label.lab{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--doux); min-width:0}
.grille-champs .large{grid-column:1 / -1}
.bascule{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:15px; min-height:40px}
.bascule input{width:22px; height:22px; accent-color:var(--acc)}
.etoiles{display:flex; gap:2px}
.etoiles button{width:30px; height:30px; border:none; background:none; color:var(--ligne); font-size:20px; padding:0; line-height:1}
.etoiles button.on{color:var(--or)}
.total{display:flex; justify-content:space-between; align-items:baseline; font-size:15px; color:var(--doux)}
.total b{color:var(--texte); font-weight:600}
.total.grand{font-size:17px; color:var(--texte)} .total.grand b{font-family:'Barlow Condensed',sans-serif; font-size:30px}
.fichier{position:relative; overflow:hidden}
.fichier input{position:absolute; inset:0; opacity:0; cursor:pointer}
.etapes{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--pale)}
.etapes .tag{font-size:12px}
.code{font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; color:var(--doux)}
/* onglets */
.onglets{position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(16,20,24,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid var(--ligne); display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); padding:7px 8px calc(7px + var(--bas))}
.onglets a{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--pale); padding:4px 0; position:relative}
.onglets a.on{color:var(--acc)}
/* 22 oct 2026 - deux volets dans la meme app : Vendeur (bleu) et Acheteur (dore) */
body.mode-acheteur{--acc:#E8C46A; --acc-fonce:#2B2414; --acc-texte:#1A1408}
.mode-switch{display:inline-flex; background:var(--carte); border:1px solid var(--ligne); border-radius:999px; padding:3px; gap:2px}
.mode-switch button{border:none; background:transparent; color:var(--doux); font-weight:700; font-size:13.5px; padding:7px 14px; border-radius:999px; display:inline-flex; align-items:center; gap:6px}
.mode-switch button.on{background:var(--acc); color:var(--acc-texte)}
.mode-switch svg{width:15px; height:15px}
.choix-mode{min-height:calc(100vh - 40px); display:flex; flex-direction:column; justify-content:center; gap:16px; max-width:520px; margin:0 auto}
.choix-mode h1{font-size:30px; margin:0; line-height:1.1}
.choix-mode .sous{font-size:15px}
.carte-mode{display:flex; gap:14px; align-items:center; text-align:left; width:100%; background:var(--carte); border:1px solid var(--ligne); border-radius:20px; padding:18px; color:var(--texte)}
.carte-mode .ico{width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.carte-mode.v .ico{background:#0F2533; color:#7FD0FF} .carte-mode.a .ico{background:#2B2414; color:#E8C46A}
.carte-mode b{font-size:19px; display:block} .carte-mode span.d{font-size:13.5px; color:var(--doux); display:block; margin-top:3px}
.carte-mode:active{transform:scale(.99)}
.hero.acheteur{background:linear-gradient(160deg,#241E10 0%,var(--carte) 70%)}
.hero.acheteur .grand{color:var(--or)}
.onglets .pastille{position:absolute; top:0; left:calc(50% + 6px); min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:#C8102E; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center}
.nav-logo{display:none}
/* 22 oct 2026 (Mathieu : « toujours pouvoir aller d'un cote comme de l'autre, en haut ; passer par l'accueil est une
   etape de trop ») - le selecteur Vendeur | Acheteur est sur TOUS les ecrans : barre du haut (mobile), menu (ordi). */
.barre-mode{position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:calc(var(--haut) + 4px) 18px 8px; background:rgba(10,13,16,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--sep)}
body.sandbox .barre-mode{top:25px; padding-top:8px}
body.avec-barre .ecran{padding-top:14px}
.barre-mode .rond{width:40px; height:40px}
.nav-mode, .nav-reglages{display:none !important}
/* feuille + toast */
.fond-feuille{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center}
.feuille{width:100%; max-width:640px; max-height:90vh; overflow-y:auto; background:#11151A; border-radius:22px 22px 0 0; padding:10px 18px calc(18px + var(--bas)); display:flex; flex-direction:column; gap:14px; animation:monte .18s ease-out}
.feuille > *{flex-shrink:0}
.feuille .poignee{width:40px; height:5px; border-radius:3px; background:var(--ligne); align-self:center}
.feuille h3{font-size:18px; font-weight:600; line-height:1.3}
.feuille .bloc{background:var(--carte)}
@keyframes monte{from{transform:translateY(40px); opacity:.4}to{transform:none; opacity:1}}
#toast{position:fixed; left:50%; bottom:calc(92px + var(--bas)); transform:translateX(-50%) translateY(20px); z-index:60; background:#F2F5F7; color:#0A0D10; font-weight:600; font-size:14px; padding:11px 16px; border-radius:12px; max-width:calc(100% - 36px); opacity:0; pointer-events:none; transition:all .2s; text-align:center}
#toast.vu{opacity:1; transform:translateX(-50%)}
.table{width:100%; border-collapse:collapse; font-size:14px}
.table td{padding:8px 4px; border-bottom:1px solid var(--sep)}
.table td.num{text-align:right; white-space:nowrap}
@media (min-width: 900px){
  body{padding-bottom:24px; padding-left:212px}
  .onglets{top:0; bottom:0; right:auto; width:212px; display:flex; flex-direction:column; gap:4px; padding:22px 12px; border-top:none; border-right:1px solid var(--ligne); background:rgba(12,15,19,.97)}
  .onglets a{flex-direction:row; justify-content:flex-start; gap:12px; font-size:15px; font-weight:600; padding:11px 12px; border-radius:12px}
  .onglets a.on{background:var(--acc-fonce)}
  .onglets .pastille{position:static; margin-left:auto}
  .nav-logo{display:flex; align-items:center; gap:10px; padding:4px 8px 22px; color:var(--texte); font-family:'Barlow Condensed',sans-serif; font-size:21px; font-weight:700; letter-spacing:.3px; white-space:nowrap}
  .nav-logo img{width:38px; height:38px; border-radius:10px}
  .barre-mode{display:none !important}
  body.avec-barre .ecran{padding-top:calc(var(--haut) + 18px)}
  .nav-mode{display:block !important; padding:0 2px 16px}
  .nav-mode .mode-switch{display:flex; width:100%} .nav-mode .mode-switch button{flex:1; min-width:0; justify-content:center; padding:8px 4px; font-size:13px} .nav-mode .mode-switch svg{display:none}
  .nav-reglages{display:flex !important; margin-top:auto}
  .ecran{max-width:1100px; padding-left:32px; padding-right:32px}

// n deja converti ; k = en milliers (12,4 k$ / $12.4k)
function fmtMontant(n, dec, k){
  const moins = n < 0 ? '-' : '', a = Math.abs(n);
  const chiffre = a.toLocaleString(LOC(), k ? {maximumFractionDigits:1} : {minimumFractionDigits:dec, maximumFractionDigits:dec});
  if (LANGUE === 'en') return moins + (DEVISE === 'USD' ? 'US$' : '$') + chiffre + (k ? 'k' : '');
  return moins + chiffre + (k ? ' k$' : ' $') + (DEVISE === 'USD' ? ' US' : '');
}

async function chargerLive(premier){

// le pouls : chaque mise a jour automatique, sa derniere fois et la prochaine
function fraicheur(t){
  if (!t.dernier) return 'vide';
  const age = (Date.now() - Date.parse(t.dernier)) / 60000;
  return age <= t.freq_min * 1.5 ? 'vert' : age <= t.freq_min * 4 ? 'or' : 'rouge';
}
function prochain(t){
  const d = Date.parse(t.dernier || ''); if (!isFinite(d)) return t.note || 'bientôt';
  const m = Math.round((d + t.freq_min * 60000 - Date.now()) / 60000);
  if (m <= 0) return 'en retard';
  return m < 60 ? `prochaine dans ${m} min` : m < 24 * 60 ? `prochaine vers ${new Date(d + t.freq_min * 60000).toLocaleTimeString(LOC(), {hour:'2-digit', minute:'2-digit'})}` : (t.note || '');
}
const COUL_POULS = {vert:'var(--vert)', or:'var(--or)', rouge:'var(--rouge)', vide:'#2E353D'};
function htmlPouls(L){
  const T = (L && L.pouls) || [];
  if (!T.length) return '<div class="vide">Serveur injoignable</div>';
  const age = (t) => { if (!t.dernier) return 'bientôt'; const m = Math.max(0, Math.round((Date.now() - Date.parse(t.dernier)) / 60000));
    return m < 1 ? 'maintenant' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' j'; };
  return `<div class="pils">${T.map(t => `<a class="pil" href="${esc(t.href || '#accueil')}" title="${esc(prochain(t))}"><i style="background:${COUL_POULS[fraicheur(t)]}"></i><b>${esc(t.nom)}</b><span>${esc(age(t))}</span></a>`).join('')}</div>`;
}

async function calculer(){

// ============================================================
// 23 oct 2026 - « une photo, un bouton » : photo du devant (+ dos, plus precis) -> fiche remplie par l'IA
// (modele avance, cote serveur : la cle n'est jamais sur le telephone). Les champs douteux sont en or.
// ============================================================
async function reduirePhoto(fichier, cote = 1600){
  const url = URL.createObjectURL(fichier);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const r = Math.min(1, cote / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * r); cv.height = Math.round(img.naturalHeight * r);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.9);
  } finally { URL.revokeObjectURL(url); }
}

async function vueComptoir(arg){
  if (['vente', 'rachat', 'clients', 'consignation'].includes(arg)) S.ongletComptoir = arg;
  const o = S.ongletComptoir;
  V().innerHTML = `<section class="ecran">
    <div class="entete"><div class="titre">Comptoir</div></div>
    <div class="seg">${[['vente','Vente'],['rachat','Rachat'],['clients','Clients'],['consignation','Consignation']].map(([k, t]) => `<button data-o="${k}" class="${o === k ? 'on' : ''}">${t}</button>`).join('')}</div>

async function clients(force){ if (!S.clients || force) S.clients = await API.clients_liste(); return S.clients; }
const optionsClients = (sel) => `<option value="">— Client (optionnel)</option>${(S.clients || []).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nom)}${c.credit ? ' · crédit ' + argent(c.credit) : ''}</option>`).join('')}`;

// re-rendu protege : remplacer le panier retire le champ actif, ce qui declenche
// un « change » (blur) qui relancerait ce rendu au milieu du premier.
let enRenduVente = false;
function rendreVente(){
  if (enRenduVente) return;
  enRenduVente = true;
  try { rendreVenteInterne(); } finally { enRenduVente = false; }
}
function rendreVenteInterne(){
  const r = S.reglages, p = S.panier;
  S.vente = S.vente || {taxes:true, paiement:'Comptant', client:null, credit:0};
  const v = S.vente, client = (S.clients || []).find(c => c.id === v.client);
  const st = p.reduce((s, l) => s + (nb(l.prix) || 0), 0), tx = v.taxes ? st * r.taxes_pct / 100 : 0, total = st + tx;
  const credit = Math.min(nb(v.credit) || 0, client ? client.credit : 0, total);
  $('#m-corps').innerHTML = `<div class="deux-col"><div style="display:flex; flex-direction:column; gap:12px">
      <div class="recherche">${ICONES.loupe}<input id="m-q" placeholder="Chercher une carte en stock" autocomplete="off"></div>
      <div id="m-res"></div>
      <div class="bloc"><div class="grille-champs"><label class="large">Article libre<input class="champ" id="m-desc" placeholder="Pack, boîte, fournitures…"></label>${champ('m-prix', 'Prix $', '', 'number')}
        <button class="btn petit" id="m-aj" style="align-self:end">${ICONES.plus}</button></div></div>
    </div><div style="display:flex; flex-direction:column; gap:12px">
      <div class="bloc">${p.length ? `<div class="liste">${p.map((l, i) => `<div class="rangee"><span class="milieu"><span class="nom">${esc(l.description)}</span>${l.carte_id ? '<span class="pastilles">' + tag('Inventaire', 'acc') + '</span>' : ''}</span>
          <input class="champ" data-prix="${i}" value="${esc(l.prix)}" inputmode="decimal" style="width:96px; text-align:right">
          <button class="ix" data-ret="${i}" aria-label="Retirer">${ICONES.x}</button></div>`).join('')}</div>` : `<div class="vide" style="padding:16px">Panier vide</div>`}</div>
      <div class="bloc">
        <select class="champ" id="m-client">${optionsClients(v.client)}</select>
        ${client && client.credit ? `<div class="grille-champs">${champ('m-credit', 'Crédit utilisé $', v.credit || '', 'number')}<span class="tag acc" style="align-self:end; height:46px; justify-content:center">Dispo ${argent(client.credit)}</span></div>` : ''}
        <div class="seg petit" id="m-pay">${['Comptant','Carte','Virement'].map(k => `<button data-p="${k}" class="${v.paiement === k ? 'on' : ''}">${k}</button>`).join('')}</div>
        <label class="bascule">Taxes (${r.taxes_pct} %)<input type="checkbox" id="m-tx" ${v.taxes ? 'checked' : ''}></label>
        <div class="total"><span>Sous-total</span><b>${argent(st)}</b></div><div class="total"><span>Taxes</span><b>${argent(tx)}</b></div>
        ${credit ? `<div class="total"><span>Crédit</span><b>− ${argent(credit)}</b></div>` : ''}
        <div class="total grand"><span>À payer</span><b>${argent(total - credit)}</b></div>
        <button class="btn" id="m-ok" ${p.length ? '' : 'disabled'}>Encaisser</button></div></div></div>`;
  let t; $('#m-q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => chercherStock(e.target.value.trim()), 200); };
  $('#m-aj').onclick = () => { if (!val('m-desc') || nb(val('m-prix')) === null) { toast('Description et prix'); return; } p.push({description:val('m-desc'), prix:nb(val('m-prix'))}); rendreVente(); };
  $$('[data-prix]').forEach(x => x.onchange = () => { p[+x.dataset.prix].prix = nb(x.value) || 0; rendreVente(); });
  $$('[data-ret]').forEach(x => x.onclick = () => { p.splice(+x.dataset.ret, 1); rendreVente(); });
  $('#m-client').onchange = (e) => { v.client = nb(e.target.value); v.credit = 0; rendreVente(); };
  const cr = $('#m-credit'); if (cr) cr.onchange = () => { v.credit = nb(cr.value) || 0; rendreVente(); };
  $$('#m-pay button').forEach(b => b.onclick = () => { v.paiement = b.dataset.p; $$('#m-pay button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#m-tx').onchange = (e) => { v.taxes = e.target.checked; rendreVente(); };
  $('#m-ok').onclick = async () => {
    const res = await essai(API.comptoir_vente({lignes:p, paiement:v.paiement, client_id:v.client, taxes:v.taxes, credit_utilise:credit}));
    if (!res) return;
    toast('Vente enregistrée · ' + argent(res.a_payer), 3500);
    S.panier = []; S.vente = null; await clients(true); rendreVente();
  };
}
async function chercherStock(q){
  const z = $('#m-res'); if (!z) return;
  if (q.length < 2) { z.innerHTML = ''; return; }
  const l = (await API.inventaire_liste({dispo:1, q, limite:8}).catch(() => [])).filter(c => !S.panier.some(x => x.carte_id === c.id));
  z.innerHTML = l.length ? `<div class="bloc"><div class="liste">${l.map(c => `<button class="rangee" data-id="${c.id}"><span class="ecusson">${esc(initiales(c))}</span>
      <span class="milieu"><span class="nom">${esc(c.titre || c.joueur)}</span><span class="pastilles">${c.emplacement ? tag(c.emplacement) : ''}${c.consignataire_id ? tag('Consigné', 'or') : ''}</span></span>
      <span class="prix">${argent(c.prix_demande ?? c.valeur, 0)}</span></button>`).join('')}</div></div>` : `<div class="pastilles">${tag('Rien trouvé')}</div>`;
  $$('#m-res .rangee').forEach(r => r.onclick = () => {
    const c = l.find(x => x.id === +r.dataset.id);
    S.panier.push({carte_id:c.id, description:c.titre || c.joueur, prix:nb(c.prix_demande ?? c.valeur) || 0}); rendreVente();
  });
}

        <div class="kpi"><b>${argentKpi(o ? o.comptant : 0)}</b><span>Comptant</span></div>

        <div class="boutons"><button class="btn ghost" id="r-comptant" ${l.length ? '' : 'disabled'}>Payer comptant</button>

  $('#r-aj').onclick = () => { const v = nb(val('r-v')); if (!val('r-t') || v === null) { toast('Carte et valeur'); return; } l.push({titre:val('r-t'), valeur:v}); rendreRachat(); };
  $$('[data-ret]').forEach(x => x.onclick = () => { l.splice(+x.dataset.ret, 1); rendreRachat(); });

async function vueBilan(){

    <div class="entete"><div class="titre">Bilan</div><input class="champ" type="month" id="b-mois" value="${S.mois}" style="width:170px"></div>

  $('#b-mois').onchange = (e) => { S.mois = e.target.value || S.mois; vueBilan(); };
  const b = await essai(API.bilan(S.mois)); if (!b) return;
  const canaux = Object.entries(b.canaux).sort((a, c) => c[1].revenus - a[1].revenus);
  const max = Math.max(1, ...canaux.map(([, v]) => v.revenus));
  $('#b-corps').innerHTML = `<div class="kpis"><div class="kpi"><b>${argentKpi(b.revenus)}</b><span>Revenus</span></div>

        <div class="total"><b>${esc(k)}</b><span>${tag(v.nb + (k === 'Breaks' ? ' breaks' : ' ventes'))} ${argent(v.revenus, 0)}</span></div>
        <div class="barre"><i style="width:${(100 * v.revenus / max).toFixed(1)}%"></i></div>
        <div class="barre"><i class="vert" style="width:${(100 * Math.max(0, v.profit) / max).toFixed(1)}%"></i></div>
        <div class="pastilles">${tag('Profit ' + argent(v.profit, 0), v.profit >= 0 ? 'vert' : 'rouge')}</div></div>`).join('')}</div>` : `<div class="vide">Aucune vente ce mois-ci</div>`}
    <div class="boutons" style="margin-top:12px"><button class="btn ghost" id="b-dep">${ICONES.plus} Dépense</button><button class="btn" id="b-csv">${ICONES.export} CSV</button></div>`;
  $('#b-dep').onclick = feuilleDepense;
  $('#b-csv').onclick = async () => { const r = await essai(API.bilan_csv(S.mois)); if (r) telecharger(r.nom, r.csv); };
}

    <details class="r-bloc r-plie"><summary><span class="r-titre">Frais et marges</span><span class="r-note">eBay ${r.frais_ebay_pct} %${act.breaks ? ' · breaks ' + r.marge_break + ' % de marge' : ''}</span></summary>

  };
  const lx = $('#g-logo-x'); if (lx) lx.onclick = async () => {

    if (res) { toast(res.joueurs + ' joueurs · ' + res.ventes.toLocaleString(LOC()) + ' ventes'); S.cat = null; S.calc.res = null; afficherVal(await API.valeurs_statut()); }
  };
}

// -- 24 oct 2026 - forfait : Gratuit ou Pro (Stripe). Payer et gerer = pages de Stripe ; le forfait
// change seulement quand Stripe confirme (avis signe), donc l'ecran relit quelques secondes apres le retour.
async function rendreForfait(retourPaiement){
  const z = $('#g-forfait'); if (!z) return;
  const f = await API.forfait().catch(() => null);
  if (!f || !f.multi) { z.hidden = true; return; }
  z.hidden = false;
  const pro = f.forfait === 'pro';
  const prix = f.prix ? `${f.prix.montant.toLocaleString(LOC(), {minimumFractionDigits:2, maximumFractionDigits:2})} $ ${f.prix.devise === 'CAD' ? '' : f.prix.devise + ' '}/ ${f.prix.intervalle === 'year' ? 'an' : 'mois'}` : '';
  const fin = f.fin ? new Date(f.fin * 1000).toLocaleDateString(LOC(), {day:'numeric', month:'long'}) : '';
  const photos = f.photos_limite != null ? `${f.photos_mois || 0} photo${(f.photos_mois || 0) > 1 ? 's' : ''} sur ${f.photos_limite} ce mois` : 'Photos illimitées';
  z.innerHTML = `<div class="r-titre" style="display:flex;justify-content:space-between;align-items:center">Mon forfait
      <span class="capsule ${pro ? 'vert' : ''}">${pro ? 'Pro' : 'Gratuit'}</span></div>
    ${f.mode_paiement === 'test' ? '<div class="r-note"><span class="capsule or">Mode test</span> aucun vrai paiement : carte 4242 4242 4242 4242</div>' : ''}
    ${pro ? `<div class="r-note">${esc(photos)}${fin ? (f.annule ? ' · se termine le ' + fin : ' · renouvelé le ' + fin) : ''}${f.statut === 'past_due' ? ' · paiement refusé : mets ta carte à jour' : ''}</div>
      ${f.client ? '<button class="btn ghost petit" id="g-gerer">Gérer mon abonnement</button>' : ''}`
    : `<div class="r-note">${esc(photos)}. Pro : photos illimitées${prix ? ', ' + prix : ''}. Annule en tout temps.</div>
      ${f.paiements ? `<button class="btn" id="g-pro">Passer à Pro${prix ? ' · ' + prix : ''}</button>` : '<div class="r-note">Le forfait Pro arrive bientôt.</div>'}`}`;
  const ouvrir = async (appel, b) => {
    b.disabled = true; const fen = window.open('', '_blank');
    const r = await essai(appel());
    b.disabled = false;
    if (!r || !r.url) { if (fen) fen.close(); return; }
    if (fen) fen.location = r.url; else location.href = r.url;
  };
  const bp = $('#g-pro'); if (bp) bp.onclick = () => ouvrir(API.abonnement_payer, bp);
  const bg = $('#g-gerer'); if (bg) bg.onclick = () => ouvrir(API.abonnement_gerer, bg);
  if (retourPaiement) history.replaceState(null, '', '#reglages');
  if (retourPaiement && !pro) {
    toast('Merci ! Ton forfait Pro s’active…', 3500);
    for (let i = 0; i < 10; i++) {
      await new Promise(ok => setTimeout(ok, 2500));
      const g = await API.forfait().catch(() => null);
      if (g && g.forfait === 'pro') { toast('Bienvenue dans Pro ✓', 3500); if ((location.hash || '').startsWith('#reglages')) rendreForfait(false); return; }
    }
    toast('Paiement reçu ? Le forfait apparaîtra dans une minute.', 4500);
  } else if (retourPaiement) toast('Bienvenue dans Pro ✓', 3500);
}

// -- compte eBay : OAuth officiel (aucun mot de passe dans l'app) --
async function rendreBlocEbay(){
  const z = $('#g-ebay'); if (!z) return;
  let s; try { s = await API.ebay_statut(); } catch (e) { z.innerHTML = tag(e.message, 'rouge'); return; }
  marquerEnv(s); S.ebaySite = s.site;
  if (!document.body.contains(z)) return;        // ecran redessine entre-temps (ex. volet change)
  // 22 oct 2026 - heberge : l'EPN et le stockage local sont geres par nous, pas par le client
  if (s.multi) { const e = $('#g-epn-bloc'), l = $('#g-local'); if (e) e.hidden = true; if (l) l.hidden = true; }
  const retour = location.origin + '/api/ebay_retour';
  const sbx = s.env === 'sandbox';
  const envSeg = s.multi ? '' : `<div class="seg petit" id="e-env" style="margin-bottom:10px">${[['production', 'Production'], ['sandbox', 'Sandbox (test)']].map(([k, t]) => `<button data-env="${k}" class="${s.env === k ? 'on' : ''}">${t}</button>`).join('')}</div>`;

  const brancherTests = () => {

      if (!await essai(API.ebay_donnees_test(20))) { t.disabled = false; t.textContent = 'Créer 20 annonces de test'; return; }

        <label class="large">Cert ID (Client Secret)<input class="champ" id="e-cert" type="password" placeholder="${esc(s.cles.cert_id || 'Colle le Cert ID')}" autocomplete="off"></label>
        <label class="large">RuName<input class="champ" id="e-ru" placeholder="${esc(s.cles.runame || 'Colle le RuName')}" autocomplete="off"></label></div>
      <button class="btn ghost petit" id="e-cles" style="margin-top:10px">Enregistrer les clés</button></details>`}
    <button class="btn" id="e-co" ${s.cles_ok ? '' : 'disabled'}>Se connecter avec eBay</button>
    <div class="grille-champs" id="e-fin" ${s.cles_ok ? '' : 'hidden'}><label class="large">Page eBay pas revenue toute seule ? Colle son adresse<input class="champ" id="e-url" placeholder="https://…?code=…" autocomplete="off"></label>
      <button class="btn petit large" id="e-terminer">Terminer la connexion</button></div>${avis}`;
  brancherEnv(); brancherAvis();
  const ecop = $('#e-copier'); if (ecop) ecop.onclick = async () => toast(await copier(retour) ? 'Adresse copiée' : 'Copie impossible');
  const ecl = $('#e-cles'); if (ecl) ecl.onclick = async () => {
    const res = await essai(API.ebay_cles_sauver({app_id:val('e-app'), cert_id:val('e-cert'), runame:val('e-ru')}));
    if (res) { toast(res.cles_ok ? 'Clés enregistrées' : 'Il manque une clé'); rendreBlocEbay(); }
  };
  $('#e-co').onclick = async () => {
    const fen = window.open('', '_blank');
    const res = await essai(API.ebay_url_connexion());
    if (!res) { if (fen) fen.close(); return; }
    if (fen) fen.location = res.url; else location.href = res.url;
    $('#e-fin').hidden = false;
  };
  $('#e-terminer').onclick = async () => { const res = await essai(API.ebay_terminer(val('e-url'))); if (res) { toast('Compte eBay connecté', 3000); rendreBlocEbay(); } };
}
