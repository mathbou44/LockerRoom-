      ${s.ecriture ? '' : `<div class="r-alerte">Reconnecte eBay pour mettre en vente et changer tes prix depuis l'app.</div>`}
      <div class="boutons"><button class="btn" id="e-sync">Synchroniser maintenant</button></div>
      <button class="r-lien" id="e-deco">Déconnecter eBay</button>`;
    if (zAv) zAv.innerHTML = `${envSeg ? '<div class="r-sous">Environnement eBay</div>' + envSeg : ''}<div class="r-note" id="e-appels"></div>${blocTest}${s.multi ? '' : avis}`;
    $('#e-sync').onclick = async () => { const bt = $('#e-sync'); bt.disabled = true; bt.textContent = 'Synchro…';
      const res = await essai(API.ebay_synchroniser(90)); if (res) toast(`${res.annonces} annonces · ${res.ventes} nouvelles ventes`, 3500); rendreBlocEbay(); };
    $('#e-deco').onclick = async () => { if (await confirmer('Déconnecter le compte eBay ?', 'Déconnecter', true)) { await essai(API.ebay_deconnecter(), 'Déconnecté'); vueReglages(); } };
    brancherEnv(); brancherTests(); brancherAvis();
    API.ebay_appels().then(a => { const z2 = $('#e-appels'); if (!z2 || !a) return;
      const n = (k) => a.appels[k] || {utilises:0, limite:0}, pct = (k) => n(k).limite ? n(k).utilises / n(k).limite : 0;
      z2.textContent = 'Appels eBay aujourd’hui : ' + ['browse', 'trading'].map(k => `${k === 'browse' ? 'marché' : 'annonces'} ${n(k).utilises.toLocaleString(LOC())} / ${n(k).limite.toLocaleString(LOC())}`).join(' · ')
        + (a.cache_pct != null ? ` · cache ${a.cache_pct} %` : ''); }).catch(() => {});
    return;
  }
  if (zAv) zAv.innerHTML = envSeg ? '<div class="r-sous">Environnement eBay</div>' + envSeg : '';
  z.innerHTML = `<div class="r-titre">Compte eBay</div>
    <div class="r-statut"><span class="pt"></span><span class="t"><b>Pas encore connecté</b><span>Recommandé : inventaire et ventes importés seuls, annonces en une photo · connexion officielle eBay, aucun mot de passe dans l'app, révocable en tout temps</span></span></div>
    ${s.cles_serveur ? '' : `<details class="reglage" ${s.cles_ok ? '' : 'open'}><summary>Clés de l’application ${s.cles_ok ? tag('OK', 'vert') : tag('À entrer', 'rouge')}</summary>
      ${s.runame_erreur ? `<div class="pastilles" style="margin-top:8px">${tag(s.runame_erreur, 'rouge')}</div>` : ''}
      <div class="etapes" style="margin:10px 0">${tag('developer.ebay.com')}›${tag('Application Keys · ' + (sbx ? 'Sandbox' : 'Production'))}›${tag('User Tokens · RuName')}</div>
      <div class="pastilles" style="margin-bottom:10px">${tag('Auth accepted URL')}<button class="tag acc" id="e-copier">${esc(retour)} ${ICONES.copie}</button></div>
      <div class="grille-champs">
        <label class="large">App ID (Client ID)<input class="champ" id="e-app" placeholder="${esc(s.cles.app_id || 'Colle l’App ID')}" autocomplete="off"></label>
        <label class="large">Cert ID (Client Secret)<input class="champ" id="e-cert" type="password" placeholder="${esc(s.cles.cert_id || 'Colle le Cert ID')}" autocomplete="off"></label>
        <label class="large">RuName<input class="champ" id="e-ru" placeholder="${esc(s.cles.runame || 'Colle le RuName')}" autocomplete="off"></label></div>
      <button class="btn ghost petit" id="e-cles" style="margin-top:10px">Enregistrer les clés</button></details>`}
    <button class="btn" id="e-co" ${s.cles_ok ? '' : 'disabled'}>Se connecter avec eBay</button>
    <div class="grille-champs" id="e-fin" ${s.cles_ok ? '' : 'hidden'}><label class="large">Page eBay pas revenue toute seule ? Colle son adresse<input class="champ" id="e-url" placeholder="https://…?code=…" autocomplete="off"></label>
      <button class="btn petit large" id="e-terminer">Terminer la connexion</button></div>${s.multi ? '' : avis}`;
  brancherEnv(); brancherAvis();
  const ecop = $('#e-copier'); if (ecop) ecop.onclick = async () => toast(await copier(retour) ? 'Adresse copiée' : 'Copie impossible');
  const ecl = $('#e-cles'); if (ecl) ecl.onclick = async () => {
    const res = await essai(API.ebay_cles_sauver({app_id:val('e-app'), cert_id:val('e-cert'), runame:val('e-ru')}));
    if (res) { toast(res.cles_ok ? 'Clés enregistrées' : 'Il manque une clé'); rendreBlocEbay(); }
  };
  $('#e-co').onclick = async () => {
    if (await relierEbayApp()) return;               // app iPhone : le navigateur securise (Google marche)
    const fen = window.open('', '_blank');
    const res = await essai(API.ebay_url_connexion());
    if (!res) { if (fen) fen.close(); return; }
    if (fen) fen.location = res.url; else location.href = res.url;
    $('#e-fin').hidden = false;
  };
  $('#e-terminer').onclick = async () => { const res = await essai(API.ebay_terminer(val('e-url'))); if (res) { toast('Compte eBay connecté', 3000); rendreBlocEbay(); } };
}

// 28 oct 2026 (Mathieu : « je me connecte a eBay avec Google et ca ne marche plus ») : dans l'app iPhone, relier eBay se
// fait dans le navigateur securise d'iOS (Google refuse les vues web : « Continuer avec Google » partait dans Safari et
// ne revenait jamais). Au retour, slabcoachauth://retour?b=... : le billet + le secret garde ici ouvrent la session.
const CAP = window.Capacitor && window.Capacitor.Plugins;
const FLUX_AUTH = /SlabCoachAuth/.test(navigator.userAgent) && CAP && CAP.Browser && CAP.App;
async function relierEbayApp(){
  if (!FLUX_AUTH) return false;
  const j = await API.ebay_jeton_lier().catch(() => null);
  if (!j || !j.ok) return false;
  const r = new Uint8Array(32); crypto.getRandomValues(r);
  const v = btoa(String.fromCharCode.apply(null, r)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  try { localStorage.setItem('sc_v', v); } catch (e) {}
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  const h = Array.from(new Uint8Array(d)).map(x => x.toString(16).padStart(2, '0')).join('');
  CAP.Browser.open({url: location.origin + '/auth/ebay-lier?t=' + encodeURIComponent(j.jeton) + '&app=' + h, presentationStyle: 'popover', toolbarColor: '#0B0B0E'});
  return true;
}
if (FLUX_AUTH) {
  const retourApp = (url) => {
    const m = /^slabcoachauth:\/\/retour\?b=([\w-]+)/.exec(url || ''); if (!m) return;
    let v = ''; try { v = localStorage.getItem('sc_v') || ''; localStorage.removeItem('sc_v'); } catch (e) {}
    try { CAP.Browser.close(); } catch (e) {}
    location.href = '/auth/terminer?b=' + m[1] + '&v=' + encodeURIComponent(v);
  };
  try { CAP.App.addListener('appUrlOpen', e => retourApp(e && e.url)); } catch (e) {}
}
// 28 oct 2026 (audit Apple 3.1.1) : dans l'app, Aide / Confidentialite / Conditions s'ouvrent dans le navigateur integre,
// en version iPhone (?ios=1 : aucun prix du site, aucun lien vers la vitrine)
document.addEventListener('click', (e) => {
  if (!NATIF) return;
  const a = e.target.closest && e.target.closest('a[href="/support"], a[href="/confidentialite"], a[href="/conditions"]'); if (!a) return;
  e.preventDefault();
  const u = location.origin + a.getAttribute('href') + '?ios=1';
  if (CAP && CAP.Browser) CAP.Browser.open({url: u, presentationStyle: 'popover', toolbarColor: '#0B0B0E'}); else location.href = u;
}, true);
