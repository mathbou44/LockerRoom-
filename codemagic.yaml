# SlabCoach (ex-LockerRoom) - compilation de l'app iPhone sur Codemagic (Mac dans le nuage) et envoi a App Store Connect.
# Ce fichier va a la RACINE du depot GitHub (a cote de server.py). Render l'ignore.
#
# Une seule fois dans Codemagic (codemagic.io) :
#   1. Teams > Integrations > Developer Portal : ajouter la cle API d'App Store Connect, nom « SlabCoach ASC ».
#   2. Teams > Code signing identities : « Generate certificate » (Apple Distribution) avec cette cle.
#   3. (27 oct 2026) APP_STORE_APPLE_ID est ecrit plus bas (vars) ; l'adresse de l'app vient de mobile/lr_url.txt
#      (ou d'une variable LR_URL ajoutee dans Codemagic, qui l'emporte).
# Ensuite : « Start new build » > ios-app-store. La version arrive dans TestFlight, puis on la soumet a Apple.
workflows:
  ios-app-store:
    name: SlabCoach iOS - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SlabCoach ASC
    environment:
      vars:
        APP_STORE_APPLE_ID: "6827726629"     # 27 oct 2026 : Apple ID de l'app (pas secret) ; LR_URL : mobile/lr_url.txt
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.slabcoach.app
      node: 22
      xcode: latest
    scripts:
      - name: Dependances
        script: |
          cd mobile
          npm ci
      - name: Adresse de l'app et plugins natifs
        script: |
          cd mobile
          node scripts/config.js
          npx cap sync ios
      - name: Signature (profils App Store)
        script: |
          xcode-project use-profiles
      - name: Numero de version (build)
        script: |
          cd mobile/ios/App
          # 27 oct 2026 : si la lecture chez Apple echoue, on ne retombe plus sur 1 (Apple refuse un numero deja utilise) :
          # le numero de build Codemagic (1, 2, 3...) sert de plancher.
          DERNIER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          [ "$TF" -gt "$DERNIER" ] 2>/dev/null && DERNIER=$TF
          NOUVEAU=$((DERNIER + 1))
          [ "${BUILD_NUMBER:-0}" -gt "$NOUVEAU" ] 2>/dev/null && NOUVEAU=$BUILD_NUMBER
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NOUVEAU;/g" App.xcodeproj/project.pbxproj
          echo "Build $NOUVEAU"
      - name: Compiler l'app (.ipa)
        script: |
          cd mobile/ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
